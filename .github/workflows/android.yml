name: Android build

# Builds and tests ProGallery on every push (cheap, emulator-free — ~6 min):
#  - build:    core + app unit tests, lint, debug/release APKs, and compiles androidTest
#  - publish:  puts the build output (incl. app-release.apk) on the `ci-results` branch
# Instrumented/visual tests run on real hardware (adb) or a local emulator, not here (see
# docs/SESSION_LOG.md). The emulator CI job was removed 2026-10-28 (unreliable + burned the
# private repo's free Actions minutes).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Stable release signing so new versions install over old ones.
      # Needs repository secrets PROGALLERY_KEYSTORE_B64 and PROGALLERY_KEYSTORE_PASSWORD;
      # without them the release APK falls back to the (per-run) debug key.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.PROGALLERY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PROGALLERY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=progallery"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
            echo "Release signing key configured."
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets set; release APK is signed with a per-run debug key."
          fi

      - name: Core unit tests
        id: core
        continue-on-error: true
        run: ./gradlew :core:test --stacktrace 2>&1 | tee core-test.log; exit ${PIPESTATUS[0]}

      - name: App unit tests
        id: apptest
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee app-test.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug + release APKs (and compile androidTest so it can't rot)
        id: assemble
        continue-on-error: true
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee assemble.log; exit ${PIPESTATUS[0]}

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug 2>&1 | tee lint.log; exit ${PIPESTATUS[0]}

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          cp *.log out/ 2>/dev/null || true
          find . -path '*/build/test-results/*' -name '*.xml' -exec cp {} out/ \; 2>/dev/null || true
          cp app/build/reports/lint-results-debug.txt out/ 2>/dev/null || true
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          # Release APK keeps the historical ProGallery-<version>.apk name. The version is read from
          # build.gradle.kts at build time (never hardcoded) and the "-media3" branch suffix is dropped,
          # so e.g. versionName 0.4.25-media3 -> ProGallery-0.4.25.apk. Debug APKs keep their names and
          # are dropped in the publish job. Done before the checksum/signing steps so they use the new name.
          VER=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERNUM=${VER%%-*}
          if [ -n "$VERNUM" ] && [ -f out/app-release.apk ]; then
            mv out/app-release.apk "out/ProGallery-$VERNUM.apk"
            echo "Release APK: ProGallery-$VERNUM.apk"
          fi
          (cd out && sha256sum *.apk > SHA256SUMS.txt 2>/dev/null || true)
          # Record the signing certificate of each APK (to verify update compatibility).
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for f in out/*.apk; do
            [ -n "$APKSIGNER" ] && { echo "== $(basename $f)"; $APKSIGNER verify --print-certs "$f" | grep -E 'SHA-256'; } >> out/SIGNING.txt || true
          done
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "core_tests=${{ steps.core.outcome }}"
            echo "app_tests=${{ steps.apptest.outcome }}"
            echo "assemble=${{ steps.assemble.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "signing=${SIGNING}"
          } > out/SUMMARY.txt
          cat out/SUMMARY.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: out/
          retention-days: 30

      - name: Fail if any stage failed
        if: always()
        run: |
          for s in "${{ steps.core.outcome }}" "${{ steps.apptest.outcome }}" "${{ steps.assemble.outcome }}"; do
            [ "$s" = "success" ] || exit 1
          done

  # NOTE: the Android emulator job was removed on 2026-10-28. On a software-GL GitHub runner it was
  # unreliable ("Failed to start Emulator console") and each run burned ~85-110 Actions minutes,
  # which exhausted this private repo's free monthly minutes. Instrumented/visual tests now run on
  # real hardware (a device over adb, or a local emulator) instead of here. The androidTest sources
  # are still COMPILED in the build job so they can't rot. See docs/SESSION_LOG.md.

  publish:
    needs: [build]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-out
          path: out
      - name: Publish to ci-results branch
        run: |
          mkdir -p out
          cat out/SUMMARY.txt 2>/dev/null || echo "(no build summary)"
          cd out
          rm -f *-debug*.apk
          git init -q -b ci-results
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
      - name: Fail if build failed
        run: '[ "${{ needs.build.result }}" = "success" ]'
