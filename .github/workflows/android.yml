name: Android build

# Builds and tests ProGallery on every push:
#  - build:        core + app unit tests, debug/release APKs, lint
#  - device-tests: instrumented UI and engine tests on an Android emulator (with screenshots)
#  - publish:      combines everything onto the `ci-results` branch for inspection

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Stable release signing so new versions install over old ones.
      # Needs repository secrets PROGALLERY_KEYSTORE_B64 and PROGALLERY_KEYSTORE_PASSWORD;
      # without them the release APK falls back to the (per-run) debug key.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.PROGALLERY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PROGALLERY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=progallery"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
            echo "Release signing key configured."
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets set; release APK is signed with a per-run debug key."
          fi

      - name: Core unit tests
        id: core
        continue-on-error: true
        run: ./gradlew :core:test --stacktrace 2>&1 | tee core-test.log; exit ${PIPESTATUS[0]}

      - name: App unit tests
        id: apptest
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee app-test.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug + release APKs
        id: assemble
        continue-on-error: true
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee assemble.log; exit ${PIPESTATUS[0]}

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug 2>&1 | tee lint.log; exit ${PIPESTATUS[0]}

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          cp *.log out/ 2>/dev/null || true
          find . -path '*/build/test-results/*' -name '*.xml' -exec cp {} out/ \; 2>/dev/null || true
          cp app/build/reports/lint-results-debug.txt out/ 2>/dev/null || true
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          (cd out && sha256sum *.apk > SHA256SUMS.txt 2>/dev/null || true)
          # Record the signing certificate of each APK (to verify update compatibility).
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for f in out/*.apk; do
            [ -n "$APKSIGNER" ] && { echo "== $(basename $f)"; $APKSIGNER verify --print-certs "$f" | grep -E 'SHA-256'; } >> out/SIGNING.txt || true
          done
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "core_tests=${{ steps.core.outcome }}"
            echo "app_tests=${{ steps.apptest.outcome }}"
            echo "assemble=${{ steps.assemble.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "signing=${SIGNING}"
          } > out/SUMMARY.txt
          cat out/SUMMARY.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: out/
          retention-days: 30

      - name: Fail if any stage failed
        if: always()
        run: |
          for s in "${{ steps.core.outcome }}" "${{ steps.apptest.outcome }}" "${{ steps.assemble.outcome }}"; do
            [ "$s" = "success" ] || exit 1
          done

  device-tests:
    # Pinned: the emulator is known to boot reliably with KVM on Ubuntu 24.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: |
          mkdir -p device-out
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace 2>&1 | tee device-out/build-apks.log

      - name: Run instrumented tests on emulator (Android 14)
        timeout-minutes: 85
        run: bash .github/scripts/run-emulator.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-out
          path: device-out/
          retention-days: 30

  publish:
    needs: [build, device-tests]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-out
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: device-out
          path: out/device
      - name: Publish to ci-results branch
        run: |
          mkdir -p out
          DEV=$(cat out/device/exit_code 2>/dev/null || echo missing)
          [ "$DEV" = "0" ] && DEVRES=success || DEVRES="failure($DEV)"
          echo "device_tests=$DEVRES" >> out/SUMMARY.txt
          echo "release_smoke=$(cat out/device/release_smoke_result 2>/dev/null || echo missing)" >> out/SUMMARY.txt
          cat out/SUMMARY.txt
          cd out
          rm -f *-debug*.apk
          git init -q -b ci-results
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
      - name: Fail if build or device tests failed
        run: |
          grep -q '^device_tests=success' out/SUMMARY.txt
          grep -q '^release_smoke=pass' out/SUMMARY.txt
          [ "${{ needs.build.result }}" = "success" ]
